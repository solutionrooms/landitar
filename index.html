<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landitar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #fs-btn {
      position: fixed;
      bottom: 8px;
      right: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #888;
      font: 11px monospace;
      padding: 4px 8px;
      cursor: pointer;
      z-index: 10;
      border-radius: 3px;
    }
    #fs-btn:hover { background: rgba(255,255,255,0.2); color: #ccc; }
  </style>
  <script type="module" crossorigin src="/landitar/assets/index-CZ1msFoW.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="fs-btn">FULLSCREEN (F)</button>
  <script>
    function toggleFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    }
    document.getElementById('fs-btn').addEventListener('click', toggleFS);
    document.addEventListener('keydown', function(e) {
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        toggleFS();
      }
    });
  </script>
</body>
</html>
